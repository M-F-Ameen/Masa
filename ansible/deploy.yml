---
- name: Deploy MASA development application
  hosts: dev
  become: false
  gather_facts: false

  vars:
    app_dir: "/opt/apps/{{ app_name }}"
    app_port: "{{ deploy_port | default('1234') }}"
    container_port: "3000"
    image_name: "{{ docker_image }}"

  pre_tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - app_name | default('') | length > 0
          - docker_image | default('') | length > 0
          - registry_url | default('') | length > 0
          - registry_user | default('') | length > 0
          - registry_password | default('') | length > 0
          - runtime_env_file | default('') | length > 0
        fail_msg: >-
          The deployment requires an image, registry credentials, and a runtime
          environment file. Ensure APP_RUNTIME_ENV_FILE is configured as a
          File-type CI/CD variable that is available to this branch (either
          unprotected, or the branch is protected).

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Install runtime environment file
      ansible.builtin.copy:
        src: "{{ runtime_env_file }}"
        dest: "{{ app_dir }}/.env"
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Install production Compose file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          services:
            db:
              image: mysql:8.0
              container_name: {{ app_name }}-db-dev
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: "root_password_masa_2026"
                MYSQL_DATABASE: resto_db
                MYSQL_USER: masa_app
                MYSQL_PASSWORD: "0250ed316d1bec238f06cad334592e554507f28a0c51487a"
              volumes:
                - {{ app_name }}-mysql-data:/var/lib/mysql
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                interval: 5s
                timeout: 5s
                retries: 30
                start_period: 45s

            app:
              image: {{ image_name }}
              container_name: {{ app_name }}-dev
              depends_on:
                db:
                  condition: service_healthy
              env_file:
                - .env
              environment:
                NODE_ENV: production
                HOSTNAME: 0.0.0.0
                PORT: {{ container_port }}
                DATABASE_URL: "mysql://masa_app:0250ed316d1bec238f06cad334592e554507f28a0c51487a@db:3306/resto_db"
              ports:
                - "{{ app_port }}:{{ container_port }}"
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:{{ container_port }}/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
                interval: 15s
                timeout: 5s
                retries: 3
                start_period: 30s

          volumes:
            {{ app_name }}-mysql-data:

    - name: Log in to GitLab Container Registry
      ansible.builtin.shell: >-
        echo "{{ registry_password }}" |
        docker login "{{ registry_url }}"
        --username "{{ registry_user }}"
        --password-stdin
      no_log: true

    - name: Validate Compose configuration
      ansible.builtin.command: docker compose config
      args:
        chdir: "{{ app_dir }}"

    - name: Pull application image
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Start database service
      ansible.builtin.command: docker compose up -d db
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for MySQL to become healthy
      ansible.builtin.command: docker inspect --format="{{ '{{' }} .State.Health.Status {{ '}}' }}" {{ app_name }}-db-dev
      register: db_health
      until: db_health.stdout == "healthy"
      retries: 30
      delay: 3
      changed_when: false

    - name: Ensure resto_db and masa_app exist in MySQL
      ansible.builtin.command: >-
        docker exec {{ app_name }}-db-dev mysql -u root -proot_password_masa_2026 -e
        "CREATE DATABASE IF NOT EXISTS resto_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
         CREATE USER IF NOT EXISTS 'masa_app'@'%' IDENTIFIED BY '0250ed316d1bec238f06cad334592e554507f28a0c51487a';
         ALTER USER 'masa_app'@'%' IDENTIFIED BY '0250ed316d1bec238f06cad334592e554507f28a0c51487a';
         GRANT ALL PRIVILEGES ON resto_db.* TO 'masa_app'@'%';
         FLUSH PRIVILEGES;"
      register: mysql_init_check
      retries: 10
      delay: 3
      until: mysql_init_check.rc == 0
      changed_when: true

    - name: Start application
      ansible.builtin.command: docker compose up -d --remove-orphans app
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for the published application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 2
        timeout: 60

    - name: Run Prisma db push to create tables
      ansible.builtin.command: docker compose exec -T app prisma db push --skip-generate --accept-data-loss
      args:
        chdir: "{{ app_dir }}"
      register: db_push_res
      changed_when: true
      failed_when: false

    - name: Print db push output
      ansible.builtin.debug:
        msg:
          - "Return code: {{ db_push_res.rc }}"
          - "stdout: {{ db_push_res.stdout_lines }}"
          - "stderr: {{ db_push_res.stderr_lines }}"

    - name: Seed database with initial restaurant data
      ansible.builtin.command: docker compose exec -T app tsx prisma/seed.ts
      args:
        chdir: "{{ app_dir }}"
      register: seed_status
      changed_when: true
      failed_when: false

    - name: Print seed status
      ansible.builtin.debug:
        msg:
          - "Return code: {{ seed_status.rc }}"
          - "stdout: {{ seed_status.stdout_lines }}"
          - "stderr: {{ seed_status.stderr_lines }}"

    - name: Verify application health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/api/health"
        status_code: 200
      register: health_check
      retries: 15
      delay: 2
      until: health_check.status == 200

    - name: Verify storefront home page
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/"
        status_code: 200
      register: home_check
      retries: 10
      delay: 2
      until: home_check.status == 200

    - name: Show application container logs
      ansible.builtin.command: docker logs --tail 30 {{ app_name }}-dev
      register: app_run_logs
      changed_when: false

    - name: Print application logs
      ansible.builtin.debug:
        var: app_run_logs.stdout_lines


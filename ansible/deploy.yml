---
- name: Deploy MASA development application
  hosts: dev
  become: false
  gather_facts: false

  vars:
    app_dir: "/opt/apps/{{ app_name }}"
    app_port: "{{ deploy_port | default('1234') }}"
    container_port: "3000"
    image_name: "{{ docker_image }}"

  pre_tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - app_name | default('') | length > 0
          - docker_image | default('') | length > 0
          - registry_url | default('') | length > 0
          - registry_user | default('') | length > 0
          - registry_password | default('') | length > 0
          - runtime_env_file | default('') | length > 0
        fail_msg: >-
          The deployment requires an image, registry credentials, and a runtime
          environment file. Ensure APP_RUNTIME_ENV_FILE is configured as a
          File-type CI/CD variable that is available to this branch (either
          unprotected, or the branch is protected).

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Install runtime environment file
      ansible.builtin.copy:
        src: "{{ runtime_env_file }}"
        dest: "{{ app_dir }}/.env"
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Install production Compose file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          services:
            db:
              image: mysql:8.0
              container_name: {{ app_name }}-db-dev
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: "root_password_masa_2026"
                MYSQL_DATABASE: resto_db
                MYSQL_USER: masa_app
                MYSQL_PASSWORD: "0250ed316d1bec238f06cad334592e554507f28a0c51487a"
              volumes:
                - {{ app_name }}-mysql-data:/var/lib/mysql
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                interval: 5s
                timeout: 5s
                retries: 30
                start_period: 45s

            app:
              image: {{ image_name }}
              container_name: {{ app_name }}-dev
              depends_on:
                db:
                  condition: service_healthy
              env_file:
                - .env
              environment:
                NODE_ENV: production
                HOSTNAME: 0.0.0.0
                PORT: {{ container_port }}
                DATABASE_URL: "mysql://masa_app:0250ed316d1bec238f06cad334592e554507f28a0c51487a@db:3306/resto_db"
              ports:
                - "{{ app_port }}:{{ container_port }}"
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:{{ container_port }}/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
                interval: 15s
                timeout: 5s
                retries: 3
                start_period: 30s

          volumes:
            {{ app_name }}-mysql-data:

    - name: Log in to GitLab Container Registry
      ansible.builtin.shell: >-
        echo "{{ registry_password }}" |
        docker login "{{ registry_url }}"
        --username "{{ registry_user }}"
        --password-stdin
      no_log: true

    - name: Validate Compose configuration
      ansible.builtin.command: docker compose config
      args:
        chdir: "{{ app_dir }}"

    - name: Pull application image
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Start application and database
      block:
        - name: Run docker compose up
          ansible.builtin.command: docker compose up -d --remove-orphans
          args:
            chdir: "{{ app_dir }}"
      rescue:
        - name: Get db container logs on failure
          ansible.builtin.command: docker logs --tail 100 {{ app_name }}-db-dev
          register: db_failure_logs
          failed_when: false
        - name: Print db logs
          ansible.builtin.debug:
            var: db_failure_logs.stdout_lines
        - name: Get app container logs on failure
          ansible.builtin.command: docker logs --tail 100 {{ app_name }}-dev
          register: app_failure_logs
          failed_when: false
        - name: Print app logs
          ansible.builtin.debug:
            var: app_failure_logs.stdout_lines
        - name: Fail deployment task
          ansible.builtin.fail:
            msg: "docker compose up failed. Check the container logs above."

    - name: Wait for the published application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 3
        timeout: 90

    - name: Show application status
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Print application status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

    - name: Verify database initialization and seed
      ansible.builtin.command: docker compose exec -T app npx tsx prisma/seed.ts
      args:
        chdir: "{{ app_dir }}"
      register: seed_status
      changed_when: true
      failed_when: false

    - name: Print seed status
      ansible.builtin.debug:
        var: seed_status.stdout_lines

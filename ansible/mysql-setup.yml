---
# One-shot playbook: opens MySQL to accept Docker connections.
# Run once, then the deploy.yml Compose will be able to reach the DB.

- name: Configure MySQL to accept connections from Docker containers
  hosts: dev
  become: true   # uses sudo
  gather_facts: false

  tasks:
    - name: Get masa-dev container logs
      ansible.builtin.command: docker logs --tail 50 masa-dev
      register: masa_logs
      changed_when: false
      failed_when: false

    - name: Print masa-dev container logs
      ansible.builtin.debug:
        var: masa_logs.stdout_lines

    - name: Get running docker containers
      ansible.builtin.command: docker ps -a
      register: docker_ps
      changed_when: false
      failed_when: false

    - name: Print running docker containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines

    - name: Check listening TCP ports
      ansible.builtin.command: ss -tlnp
      register: listening_ports
      changed_when: false

    - name: Print listening TCP ports
      ansible.builtin.debug:
        var: listening_ports.stdout_lines

    - name: Search for any cnf files
      ansible.builtin.command: find /etc -name "*cnf" -o -name "*cnf.d"
      register: cnf_files
      changed_when: false
      failed_when: false

    - name: Print cnf files found
      ansible.builtin.debug:
        var: cnf_files.stdout_lines

    - name: Check systemd services for sql
      ansible.builtin.command: systemctl list-units --type=service | grep -iE 'sql|maria|db'
      register: sql_services
      changed_when: false
      failed_when: false

    - name: Print sql services
      ansible.builtin.debug:
        var: sql_services.stdout_lines

